spring:
  application:
    name: simpleec-frontend-job
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: frontend-job-group
      max-poll-records: 100
      auto-offset-reset: earliest
  mvc:
    async:
      request-timeout: 300000

server:
  port: 8089

logging:
  level:
    com.simpleec: DEBUG
    org.springframework.kafka: INFO
