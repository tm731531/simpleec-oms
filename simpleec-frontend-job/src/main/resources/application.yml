spring:
  application:
    name: simpleec-frontend-job
  kafka:
    bootstrap-servers: simpleec-kafka:9092
    consumer:
      group-id: frontend-job-group
      max-poll-records: 100
      auto-offset-reset: earliest
      # Bound fetch buffer — see brain/kafka-message-queue.md (Iron Rule)
      fetch-max-bytes: 1048576
      max-partition-fetch-bytes: 262144
  mvc:
    async:
      request-timeout: 300000

server:
  port: 8089

jwt:
  secret: ${JWT_SECRET:simpleec-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security}
  expiration: 604800  # 7 days in seconds

logging:
  level:
    com.simpleec: INFO
    org.springframework.kafka: INFO
