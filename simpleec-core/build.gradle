plugins {
    id 'java-library'
}

dependencies {
    api project(':simpleec-common')

    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.kafka:spring-kafka'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MyBatis-Plus (Spring Boot 3 compatible)
    api 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.7'

    // OpenTelemetry API (for manual trace-id injection; agent provides implementation)
    api 'io.opentelemetry:opentelemetry-api'

    // Structured JSON logging for Loki
    api 'net.logstash.logback:logstash-logback-encoder:8.0'

    runtimeOnly 'org.postgresql:postgresql'
}
