system:
  name: "SimpleEC OMS"
  version: 1

platforms:
  - code: momo
    name: "MOMO"
    fastConcurrency: 8
    slowConcurrency: 4

  - code: shopee
    name: "Shopee"
    fastConcurrency: 8
    slowConcurrency: 4

  - code: yahoo
    name: "Yahoo 購物中心"
    fastConcurrency: 8
    slowConcurrency: 4

  - code: pchome
    name: "PChome"
    fastConcurrency: 8
    slowConcurrency: 4

  - code: cyberbiz
    name: "Cyberbiz"
    fastConcurrency: 6
    slowConcurrency: 3

  - code: shopline
    name: "Shopline"
    fastConcurrency: 6
    slowConcurrency: 3

  - code: shopify
    name: "Shopify"
    fastConcurrency: 8
    slowConcurrency: 4

infrastructure:
  postgres:
    port: 5433
    image: postgres:16-alpine
    container_name: simpleec-postgres

  redis:
    port: 6379
    image: redis:7-alpine
    container_name: simpleec-redis

  kafka:
    port: 9092
    image: apache/kafka:3.7.1
    container_name: simpleec-kafka
    autoCreateTopics: true
    defaultPartitions: 3
    defaultReplicationFactor: 1
    retentionHours: 1

  kafka-ui:
    port: 8088
    internal_port: 8080
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: simpleec-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    port: 9090
    image: prom/prometheus:v3.1.0
    container_name: simpleec-prometheus

  grafana:
    port: 3000
    image: grafana/grafana:11.4.0
    container_name: simpleec-grafana

  loki:
    port: 3100
    image: grafana/loki:3.3.2
    container_name: simpleec-loki

  otel-collector:
    port: 4317
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: simpleec-otel-collector

  tempo:
    port: 3200
    image: grafana/tempo:2.6.1
    container_name: simpleec-tempo

services:
  api:
    port: 8082
    image: simpleec-api
    contextPath: /api

  gateway:
    port: 8081
    image: simpleec-gateway

  nginx:
    port: 8089
    image: simpleec-nginx

  userApp:
    port: 5173
    image: simpleec-user-app

  adminApp:
    port: 8084
    image: simpleec-admin-app

jobs:
  orderJob:
    image: simpleec-order-job

  schedulerJob:
    image: simpleec-scheduler-job

  backendJob:
    image: simpleec-backend-job

  frontendJob:
    image: simpleec-frontend-job

  retryJob:
    image: simpleec-retry-job
