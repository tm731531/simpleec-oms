<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的訂單 - SimpleEC OMS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-card .label {
            color: #999;
            font-size: 14px;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #f9f9f9;
        }

        .table-header h2 {
            font-size: 20px;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f9f9f9;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
            color: #666;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #cfe2ff; color: #084298; }
        .status-shipped { background: #cff4fc; color: #055160; }
        .status-completed { background: #d1e7dd; color: #0f5132; }
        .status-cancelled { background: #f8d7da; color: #842029; }

        .platform-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            margin-right: 5px;
        }

        .platform-momo { background: #667eea; }
        .platform-shopee { background: #ff6b6b; }
        .platform-yahoo { background: #ffa500; }
        .platform-pchome { background: #00d4ff; }
        .platform-cyberbiz { background: #32c759; }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background: #667eea;
            color: white;
            transition: all 0.3s;
            margin-right: 5px;
        }

        .action-btn:hover {
            background: #5568d3;
        }

        .action-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .action-btn.secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .pagination {
            padding: 20px;
            text-align: center;
        }

        .pagination button {
            padding: 8px 12px;
            margin: 0 5px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover {
            background: #f0f0f0;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>📋 我的訂單</h1>
            <p>從 OMS 系統查看您的所有訂單和狀態</p>
        </div>
    </div>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="label">總訂單數</div>
                <div class="number" id="stat-total">-</div>
            </div>
            <div class="stat-card">
                <div class="label">待確認</div>
                <div class="number" id="stat-pending">-</div>
            </div>
            <div class="stat-card">
                <div class="label">配送中</div>
                <div class="number" id="stat-shipped">-</div>
            </div>
            <div class="stat-card">
                <div class="label">已完成</div>
                <div class="number" id="stat-completed">-</div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>📦 最近訂單</h2>
            </div>
            <div id="error-msg"></div>
            <div id="loading" class="loading" style="display:none;">加載中...</div>
            <table id="orders-table">
                <thead>
                    <tr>
                        <th>訂單號</th>
                        <th>通路</th>
                        <th>訂單金額</th>
                        <th>狀態</th>
                        <th>建立時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                </tbody>
            </table>
            <div class="pagination">
                <button onclick="prevPage()">上一頁</button>
                <span id="page-info">第 1 頁</span>
                <button onclick="nextPage()">下一頁</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://192.168.0.48:8091/api';
        let currentPage = 1;
        const pageSize = 10;

        async function loadOrders() {
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');
            const ordersBody = document.getElementById('orders-body');

            loading.style.display = 'block';
            errorMsg.innerHTML = '';

            try {
                // 獲取訂單列表
                const response = await fetch(`${API_BASE}/orders?limit=${pageSize}&offset=${(currentPage - 1) * pageSize}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const orders = data.data || data.orders || [];

                loading.style.display = 'none';

                if (orders.length === 0) {
                    ordersBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px;">沒有訂單</td></tr>';
                    return;
                }

                // 填充表格
                ordersBody.innerHTML = orders.map(order => `
                    <tr>
                        <td><strong>${order.channelOrderId || order.id}</strong></td>
                        <td><span class="platform-badge platform-${order.platform?.toLowerCase() || 'momo'}">${order.platform || 'N/A'}</span></td>
                        <td>$${(order.totalAmount || 0).toFixed(2)}</td>
                        <td><span class="status-badge status-${order.status?.toLowerCase() || 'pending'}">${formatStatus(order.status)}</span></td>
                        <td>${formatDate(order.createdAt)}</td>
                        <td>
                            <button class="action-btn" onclick="alert('訂單詳情：' + JSON.stringify(order, null, 2))">查看</button>
                            <button class="action-btn secondary">更多</button>
                        </td>
                    </tr>
                `).join('');

                // 更新統計
                updateStats(orders);

            } catch (error) {
                console.error('Error loading orders:', error);
                loading.style.display = 'none';
                errorMsg.innerHTML = `<div class="error">⚠️ 無法連接到 API：${error.message}</div>`;
                ordersBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:#999;">API 連接失敗</td></tr>';

                // 使用模擬數據
                loadMockData();
            }
        }

        function loadMockData() {
            const mockOrders = [
                {
                    id: 'ORD-20260220-001',
                    channelOrderId: '#ORD-20260220-001',
                    platform: 'MOMO',
                    totalAmount: 450,
                    status: 'completed',
                    createdAt: '2026-02-20 10:30:00'
                },
                {
                    id: 'ORD-20260220-002',
                    channelOrderId: '#ORD-20260220-002',
                    platform: 'Shopee',
                    totalAmount: 320,
                    status: 'shipped',
                    createdAt: '2026-02-20 09:15:00'
                },
                {
                    id: 'ORD-20260220-003',
                    channelOrderId: '#ORD-20260220-003',
                    platform: 'Yahoo',
                    totalAmount: 580,
                    status: 'confirmed',
                    createdAt: '2026-02-20 08:45:00'
                }
            ];

            const ordersBody = document.getElementById('orders-body');
            ordersBody.innerHTML = mockOrders.map(order => `
                <tr>
                    <td><strong>${order.channelOrderId}</strong></td>
                    <td><span class="platform-badge platform-${order.platform?.toLowerCase()}">${order.platform}</span></td>
                    <td>$${order.totalAmount.toFixed(2)}</td>
                    <td><span class="status-badge status-${order.status}">${formatStatus(order.status)}</span></td>
                    <td>${order.createdAt}</td>
                    <td>
                        <button class="action-btn">查看</button>
                        <button class="action-btn secondary">更多</button>
                    </td>
                </tr>
            `).join('');

            updateStats(mockOrders);
        }

        function updateStats(orders) {
            const stats = {
                total: orders.length,
                pending: orders.filter(o => o.status === 'pending').length,
                shipped: orders.filter(o => o.status === 'shipped').length,
                completed: orders.filter(o => o.status === 'completed').length
            };

            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-pending').textContent = stats.pending;
            document.getElementById('stat-shipped').textContent = stats.shipped;
            document.getElementById('stat-completed').textContent = stats.completed;
        }

        function formatStatus(status) {
            const map = {
                'pending': '待確認',
                'confirmed': '已確認',
                'shipped': '配送中',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            return map[status?.toLowerCase()] || status;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-TW');
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadOrders();
                updatePageInfo();
            }
        }

        function nextPage() {
            currentPage++;
            loadOrders();
            updatePageInfo();
        }

        function updatePageInfo() {
            document.getElementById('page-info').textContent = `第 ${currentPage} 頁`;
        }

        // 初始化
        window.addEventListener('load', loadOrders);
    </script>
</body>
</html>
