version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: simpleec-postgres
    ports:
    - 5433:5432
    command:
    - postgres
    - -c
    - max_connections=200
    environment:
      POSTGRES_DB: simpleec
      POSTGRES_USER: simpleec
      POSTGRES_PASSWORD: simpleec123
    volumes:
    - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U simpleec
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: simpleec-redis
    ports:
    - 6379:6379
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --dir
    - /data
    volumes:
    - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.7.1
    container_name: simpleec-kafka
    ports:
    - 9092:9092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_LOG_RETENTION_HOURS: '1'
      KAFKA_LOG_RETENTION_BYTES: '-1'
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_CLEANUP_ENABLE: 'true'
      CLUSTER_ID: simpleec-kraft-cluster-001
    volumes:
    - ${DATA_DIR:-./data}/kafka:/tmp/kraft-combined-logs
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
        || exit 1
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
  kafka-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.kafka-init
    container_name: simpleec-kafka-init
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_PARTITIONS: '3'
      KAFKA_REPLICATION_FACTOR: '1'
      KAFKA_RETENTION_MS: '3600000'
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
  simpleec-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: simpleec-kafka-ui
    ports:
    - 8088:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: simpleec
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
  simpleec-prometheus:
    image: prom/prometheus:v3.1.0
    container_name: simpleec-prometheus
    ports:
    - 9090:9090
    restart: unless-stopped
  simpleec-grafana:
    image: grafana/grafana:11.4.0
    container_name: simpleec-grafana
    ports:
    - 3000:3000
    restart: unless-stopped
  simpleec-loki:
    image: grafana/loki:3.3.2
    container_name: simpleec-loki
    ports:
    - 3100:3100
    restart: unless-stopped
  simpleec-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: simpleec-otel-collector
    ports:
    - 4317:4317
    restart: unless-stopped
  simpleec-tempo:
    image: grafana/tempo:2.6.1
    container_name: simpleec-tempo
    ports:
    - 3200:3200
    restart: unless-stopped
  simpleec-channel-momo-fast:
    image: simpleec-channel-job
    build:
      context: .
      dockerfile: docker/Dockerfile.channel-job
    container_name: simpleec-channel-momo-fast
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: simpleec
      DB_USER: simpleec
      DB_PASSWORD: simpleec123
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JOB_CHANNEL_TOPICS: momo.fast
      JOB_CHANNEL_GROUP_ID: channel-job-momo
      JOB_CHANNEL_CONCURRENCY: '3'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
