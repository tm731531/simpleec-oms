plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

group = 'com.simpleec'
version = '1.0.0'
sourceCompatibility = '17'

allprojects {
    repositories {
        mavenCentral()
        maven { url "https://repo.spring.io/release" }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.simpleec'
    version = '1.0.0'
    sourceCompatibility = '17'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        // Core Spring
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

        // Kafka
        implementation 'org.springframework.kafka:spring-kafka'

        // Database
        implementation 'org.postgresql:postgresql:42.7.1'
        implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'

        // Redis
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'

        // Lombok
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // JSON
        implementation 'com.fasterxml.jackson.core:jackson-databind'
        implementation 'com.google.code.gson:gson:2.10.1'

        // Utils
        implementation 'org.apache.commons:commons-lang3:3.14.0'
        implementation 'commons-codec:commons-codec:1.15'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
    }

    test {
        useJUnitPlatform()
    }

    tasks.named('bootJar') {
        enabled = false
    }

    tasks.named('jar') {
        enabled = true
    }
}

// Layer 2 & 3 depend on Layer 1
configure(subprojects.findAll { it.name.startsWith('simpleec-') && it.name != 'simpleec-common' && it.name != 'simpleec-core' }) {
    dependencies {
        implementation project(':simpleec-common')
    }
}

// Layer 2 depends on Layer 1
configure(subprojects.findAll { ['simpleec-channel', 'simpleec-api', 'simpleec-gateway'].contains(it.name) }) {
    dependencies {
        implementation project(':simpleec-core')
    }
}

// Channel/API/Gateway should be available for Layer 3
configure(subprojects.findAll { ['simpleec-channel-job', 'simpleec-order-job', 'simpleec-scheduler-job', 'simpleec-backend-job', 'simpleec-frontend-job', 'simpleec-retry-job'].contains(it.name) }) {
    dependencies {
        implementation project(':simpleec-core')
        // Some may need channel if they use ChannelAdapter
    }
}
