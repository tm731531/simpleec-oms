spring:
  application:
    name: simpleec-api
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:simpleec-postgres}:${DB_PORT:5432}/simpleec
    username: simpleec
    password: ${DB_PASSWORD:simpleec123}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # 既有 DB 無 flyway_schema_history 時，自動以 V1 為基線
    baseline-version: 1         # 基線版本 = V1（初始 schema）
    out-of-order: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:simpleec-kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:simpleec-kafka:9092}
      group-id: api-consumer-group
      auto-offset-reset: earliest

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:simpleec-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security}
  expiration: 604800  # 7 days in seconds

simpleec:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000}
  shopee:
    callback-url: ${SHOPEE_CALLBACK_URL:http://localhost:8082/callback/shopee}

logging:
  level:
    com.simpleec: DEBUG
    org.springframework.kafka: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
