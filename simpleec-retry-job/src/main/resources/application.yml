spring:
  application:
    name: simpleec-retry-job
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:simpleec-postgres}:${DB_PORT:5432}/simpleec
    username: simpleec
    password: simpleec123
  kafka:
    bootstrap-servers: simpleec-kafka:9092
    consumer:
      group-id: retry-job-group
      auto-offset-reset: earliest
  data:
    redis:
      host: simpleec-redis
      port: 6379

server:
  port: 8087

logging:
  level:
    com.simpleec: DEBUG
