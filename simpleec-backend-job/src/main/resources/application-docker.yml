spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/simpleec
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      bootstrap-servers: kafka:9092
  data:
    redis:
      host: redis
      port: 6379
