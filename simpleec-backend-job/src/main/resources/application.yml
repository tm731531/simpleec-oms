spring:
  application:
    name: simpleec-backend-job
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:simpleec-postgres}:${DB_PORT:5432}/simpleec
    username: simpleec
    password: simpleec123
  kafka:
    bootstrap-servers: simpleec-kafka:9092
    consumer:
      bootstrap-servers: simpleec-kafka:9092
      group-id: backend-consumer-group
      auto-offset-reset: earliest
  data:
    redis:
      host: simpleec-redis
      port: 6379

server:
  port: 8084

logging:
  level:
    com.simpleec: DEBUG
    com.simpleec.backendJob: DEBUG
    org.springframework.kafka: DEBUG
