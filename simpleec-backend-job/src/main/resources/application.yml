spring:
  application:
    name: simpleec-backend-job
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:simpleec-postgres}:${DB_PORT:5432}/simpleec
    username: simpleec
    password: ${DB_PASSWORD:simpleec123}
  kafka:
    bootstrap-servers: simpleec-kafka:9092
    consumer:
      bootstrap-servers: simpleec-kafka:9092
      group-id: backend-consumer-group
      auto-offset-reset: earliest
      # Cap poll() size — see brain/kafka-message-queue.md (Iron Rule)
      max-poll-records: 10
      fetch-max-bytes: 1048576
      max-partition-fetch-bytes: 262144
  data:
    redis:
      host: simpleec-redis
      port: 6379

server:
  port: 8084

logging:
  level:
    com.simpleec: INFO
    com.simpleec.backendJob: INFO
    org.springframework.kafka: INFO
