spring:
  application:
    name: simpleec-scheduler-job
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:simpleec-postgres}:${DB_PORT:5432}/simpleec
    username: simpleec
    password: ${DB_PASSWORD:simpleec123}
  kafka:
    bootstrap-servers: simpleec-kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: simpleec-kafka:9092
      group-id: scheduler-consumer-group
      auto-offset-reset: earliest
      # Scheduler processes few tasks per tick — see brain/kafka-message-queue.md
      max-poll-records: 5
      fetch-max-bytes: 1048576
      max-partition-fetch-bytes: 262144
  data:
    redis:
      host: ${REDIS_HOST:simpleec-redis}
      port: 6379
      timeout: 2000

server:
  port: 8083

logging:
  level:
    com.simpleec: INFO
    com.simpleec.schedulerjob: INFO
    org.springframework.kafka: INFO
    org.springframework.kafka.listener: INFO
