global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OTEL Collector (aggregated metrics from all JOBs via OTLP)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # API services (have Actuator /prometheus endpoint)
  - job_name: 'simpleec-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['simpleec-api:8080']

  - job_name: 'simpleec-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['simpleec-gateway:8081']
