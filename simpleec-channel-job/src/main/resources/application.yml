spring:
  application:
    name: simpleec-channel-job
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:simpleec-kafka:9092}
    consumer:
      group-id: ${JOB_CHANNEL_GROUP_ID:channel-job-group}
      auto-offset-reset: earliest
      # Cap each poll() at ~1MB so a 256MB-heap container never gets a
      # 52MB batch dumped into heap during consumer-lag spikes (the
      # classic "poison batch crash loop" — see brain/kafka-message-queue.md).
      max-poll-records: 10
      fetch-max-bytes: 1048576           # 1 MB total per poll
      max-partition-fetch-bytes: 262144  # 256 KB per partition
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simpleec_oms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    enabled: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.simpleec: INFO
