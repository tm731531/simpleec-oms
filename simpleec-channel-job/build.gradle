plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':simpleec-common')
    implementation project(':simpleec-core')
    implementation project(':simpleec-channel')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.7'

    runtimeOnly 'org.postgresql:postgresql'
}

bootJar {
    archiveFileName = 'simpleec-channel-job.jar'
    mainClass = 'com.simpleec.job.channel.SimpleecChannelJobApplication'
}
